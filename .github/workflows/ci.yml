name: Q-Med CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure qiskit-algorithms 0.3.1 compatibility with qiskit 1.2.4 / qiskit-nature 0.7.2 if needed
          python -c "import qiskit_algorithms" 2>/dev/null || pip install qiskit-algorithms==0.3.1

      - name: Run pytest suite
        run: |
          pytest -v
